# Firebase App Hosting configuration.
#
# Why this file exists: without it, App Hosting starts the container with no environment
# variables at all. The build succeeds — it needs nothing — and then `src/instrumentation.ts`
# refuses to boot, because starting a healthcare app with no DATABASE_URL and no
# FIELD_ENCRYPTION_KEY would mean serving errors on every request and, worse, being one code
# path away from writing clinical data unencrypted. The container exits, the health check
# fails, and the rollout is marked failed with a build log that looks clean.
#
# That fail-fast is working as intended (see DEPLOYMENT.md "Required configuration"); the
# missing piece was always this file.
#
# ---------------------------------------------------------------------------------------
# BEFORE THIS WILL DEPLOY: create the secrets. App Hosting reads them from Google Secret
# Manager, and `firebase apphosting:secrets:set` also grants the backend access to them.
#
#   firebase apphosting:secrets:set DATABASE_URL          --project studio-4511819966-bc14f
#   firebase apphosting:secrets:set NEXTAUTH_SECRET       --project studio-4511819966-bc14f
#   firebase apphosting:secrets:set FIELD_ENCRYPTION_KEY  --project studio-4511819966-bc14f
#
# Generate the two key values with:  openssl rand -base64 32
#
# FIELD_ENCRYPTION_KEY must be treated as permanent. It decrypts every stored diagnosis,
# note, prescription, and TOTP secret. Rotating it without re-encrypting existing rows makes
# that data unreadable — `decryptField` will return its "unreadable" marker rather than
# throwing, so the failure is survivable, but the content is gone. Back it up somewhere
# separate from the database.
#
# The four blocks below (PAYMENT_PROVIDER, EMAIL/SMS/WHATSAPP_PROVIDER, STORAGE_PROVIDER)
# stay on their safe no-credential defaults ("dev"/"local") in this file deliberately: this
# repo holds no real PayTabs/SendGrid/Twilio/S3 account, so flipping any of them to their
# real value here — without also provisioning the matching secret below — would make
# env-check.ts refuse to boot the whole app over one unconfigured integration, which is
# worse than the current graceful per-feature degradation. Each block documents the exact
# secrets + value change needed; a deploy operator with real credentials flips one block at
# a time, `firebase apphosting:secrets:set`-ing the new secret(s) first.
# ---------------------------------------------------------------------------------------

runConfig:
  # minInstances: 1 — no cold start on a booking page. Raised from 0 once this stopped being
  # a "not yet carrying production traffic" backend; revert to 0 only for a throwaway/staging
  # deploy where the occasional cold start is an acceptable tradeoff for cost.
  cpu: 1
  memoryMiB: 512
  minInstances: 1
  maxInstances: 2
  concurrency: 80

env:
  # ---- Secrets (Google Secret Manager) ----
  # RUNTIME only. The build genuinely does not need them — verified by building this repo
  # from a clean checkout with no environment at all — and a secret that never enters the
  # build step cannot leak through a build log or a cached layer.
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
    availability:
      - RUNTIME

  - variable: FIELD_ENCRYPTION_KEY
    secret: FIELD_ENCRYPTION_KEY
    availability:
      - RUNTIME

  # ---- Plain configuration ----
  # Must match the backend's public URL exactly — scheme, region, no trailing slash.
  #
  # This was wrong once, and the failure is worth describing because nothing reports it: the
  # value said `us-central1` while the backend runs in `us-east4`. NextAuth builds its
  # callback URLs and sets its session cookie from this, so credentials were accepted and
  # the cookie was then scoped to a host nobody was browsing. The user lands back on the
  # public site still showing "sign in", indistinguishable from a wrong password.
  #
  # The region is part of the hostname and is *not* guessable — read it off the backend in
  # the App Hosting console rather than assuming. `src/middleware.ts` now warns once per
  # process when the incoming Host disagrees with this value.
  - variable: NEXTAUTH_URL
    value: https://docbook--studio-4511819966-bc14f.us-east4.hosted.app
    availability:
      - RUNTIME

  # The same origin, but needed at BUILD as well as RUNTIME — which is why it is a separate
  # variable rather than reusing NEXTAUTH_URL above.
  #
  # robots.txt, the sitemap and `metadataBase` (which resolves every canonical and hreflang
  # tag) are baked into statically rendered output during `next build`. A build that cannot
  # read this emits canonicals pointing at localhost: the deploy succeeds, the pages render
  # correctly to a human, and search engines are told the whole site duplicates a host they
  # cannot reach. Keep both entries in step if the domain changes.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://docbook--studio-4511819966-bc14f.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # The rule-based assistant is a real production choice, not a stub: keyword triage over
  # the tenant's own Specialty rows, no key, and no symptom text leaving the platform. Set
  # AI_PROVIDER=claude and add an ANTHROPIC_API_KEY secret to switch.
  - variable: AI_PROVIDER
    value: rule-based
    availability:
      - RUNTIME

  # Dev adapters log instead of delivering. Booking, queue, and records are unaffected;
  # notifications degrade rather than failing the action that triggered them.
  #
  # Real adapters exist and are tested (SendGridAdapter, TwilioAdapter — see
  # src/lib/notifications/). To go live on EMAIL:
  #   firebase apphosting:secrets:set SENDGRID_API_KEY --project studio-4511819966-bc14f
  # then change this block's EMAIL_PROVIDER value to `sendgrid` and add:
  #   - variable: SENDGRID_API_KEY
  #     secret: SENDGRID_API_KEY
  #     availability: [RUNTIME]
  #   - variable: EMAIL_FROM_ADDRESS      # must be a SendGrid-verified sender
  #     value: no-reply@<your-domain>
  #     availability: [RUNTIME]
  # SMS and WHATSAPP both go live the same way with `twilio` + one secrets pair
  # (TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN) shared between them, plus their own
  # TWILIO_SMS_FROM_NUMBER / TWILIO_WHATSAPP_FROM_NUMBER (E.164). See .env.example for the
  # full variable list; env-check.ts refuses to boot if a *_PROVIDER is flipped without its
  # matching secrets present, so there is no silent half-configured state.
  # PUSH has no real adapter: device-token registration needs a mobile/web client nothing in
  # this codebase implements yet (see src/lib/services/notifications.ts's `destinationFor`
  # doc comment) — leave PUSH_PROVIDER on `dev` until that client-side piece exists.
  - variable: EMAIL_PROVIDER
    value: dev
    availability:
      - RUNTIME
  - variable: SMS_PROVIDER
    value: dev
    availability:
      - RUNTIME
  - variable: WHATSAPP_PROVIDER
    value: dev
    availability:
      - RUNTIME
  - variable: PUSH_PROVIDER
    value: dev
    availability:
      - RUNTIME

  # `getPaymentProvider()` refuses the dev adapter under NODE_ENV=production by design, so
  # payment collection will return an error until a real gateway is configured. Everything
  # else works. This is a startup *warning*, not a boot failure — a clinic should not lose
  # its appointment book over an unconfigured gateway.
  #
  # PayTabsAdapter is built, tested against a local mock replicating PayTabs' real contract,
  # and ready — see its own doc comment in src/lib/payments/paytabs-adapter.ts for exactly
  # what that has and hasn't verified. To go live:
  #   firebase apphosting:secrets:set PAYTABS_PROFILE_ID --project studio-4511819966-bc14f
  #   firebase apphosting:secrets:set PAYTABS_SERVER_KEY --project studio-4511819966-bc14f
  # then change this block's value to `paytabs` and add:
  #   - variable: PAYTABS_PROFILE_ID
  #     secret: PAYTABS_PROFILE_ID
  #     availability: [RUNTIME]
  #   - variable: PAYTABS_SERVER_KEY
  #     secret: PAYTABS_SERVER_KEY
  #     availability: [RUNTIME]
  # Run one live Playwright booking-and-pay flow against PayTabs' real sandbox immediately
  # after flipping this, to catch any field-level drift from the documented contract before
  # real cards touch it.
  - variable: PAYMENT_PROVIDER
    value: dev
    availability:
      - RUNTIME

  # Local disk on App Hosting is ephemeral: uploaded documents vanish on every rollout and
  # are not shared between instances.
  #
  # S3StorageAdapter is built and tested (AWS Signature Version 4, verified against an
  # independent from-scratch re-derivation of the signature in tests/integration/
  # s3-adapter.test.ts, not just "a request was sent") — see src/lib/storage/s3-adapter.ts.
  # To go live:
  #   firebase apphosting:secrets:set S3_ACCESS_KEY_ID     --project studio-4511819966-bc14f
  #   firebase apphosting:secrets:set S3_SECRET_ACCESS_KEY --project studio-4511819966-bc14f
  # then change this block's STORAGE_PROVIDER value to `s3` and add:
  #   - variable: S3_BUCKET
  #     value: <your-bucket-name>
  #     availability: [RUNTIME]
  #   - variable: S3_REGION
  #     value: <your-bucket-region>          # e.g. eu-west-1
  #     availability: [RUNTIME]
  #   - variable: S3_ACCESS_KEY_ID
  #     secret: S3_ACCESS_KEY_ID
  #     availability: [RUNTIME]
  #   - variable: S3_SECRET_ACCESS_KEY
  #     secret: S3_SECRET_ACCESS_KEY
  #     availability: [RUNTIME]
  # S3_ENDPOINT is optional, only for an S3-compatible provider other than AWS itself
  # (R2, Spaces, MinIO) — leave it unset for real AWS S3.
  - variable: STORAGE_PROVIDER
    value: local
    availability:
      - RUNTIME
  - variable: STORAGE_LOCAL_PATH
    value: /tmp/.storage
    availability:
      - RUNTIME

  - variable: DEFAULT_COUNTRY
    value: JO
    availability:
      - RUNTIME
  - variable: DEFAULT_LOCALE
    value: ar
    availability:
      - RUNTIME
