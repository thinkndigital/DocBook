name: Apply database migrations

# Manual only, on purpose.
#
# App Hosting builds and serves but never migrates, so this fills that gap without putting
# schema changes on an automatic trigger. Auto-migrating on every push sends a schema change
# to production the moment someone merges, with no window to catch a mistake, and not every
# migration is reversible.
#
# SETUP (once)
#   GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  DATABASE_URL
#     Value: your Neon connection string
#
# RUN
#   Actions -> "Apply database migrations" -> Run workflow.
#
# No Postgres, Node, or terminal needed on your own machine.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be applied, change nothing'
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set. See the comments at the top of this file."
            exit 1
          fi
          # Migrations take a session-level advisory lock, which PgBouncer's transaction
          # pooling cannot hold. Through a pooled endpoint they hang or fail with a lock
          # error that reads like a database fault rather than a wrong-endpoint mistake.
          case "$DATABASE_URL" in
            *-pooler.*)
              echo "::error::This is Neon's POOLED endpoint (hostname contains '-pooler'). Migrations need the direct one: turn OFF 'Connection pooling' in Neon's Connect dialog and use that string."
              exit 1
              ;;
          esac

      # Both names are set from the same secret: schema.prisma declares `directUrl`, so the
      # CLI requires DIRECT_DATABASE_URL to exist even when it is the same connection.
      # `prisma migrate status` exits 1 whenever migrations are pending. That is its way of
      # reporting drift, not a failure — but a step that exits non-zero aborts the job, so
      # this workflow could never apply migrations to a fresh database: the status step
      # killed the run before the deploy step was reached. Reporting is informational here;
      # the deploy step below is what is allowed to fail.
      - name: Show current state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status || true

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Summary
        if: always()
        run: |
          {
            echo "### Database migrations"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — nothing was changed."
            else
              echo "Migrations applied. Trigger an App Hosting rollout next."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
